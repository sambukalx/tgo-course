services:
  api:
    build:
      context: ..
      dockerfile: coursework/Dockerfile
    ports:
      - "127.0.0.1:${COURSE_API_PORT:-8000}:8000"
    environment:
      COURSE_THREADS: "${COURSE_THREADS:-8}"
      COURSE_MODEL: "${COURSE_MODEL:-Qwen/Qwen3-1.7B}"
      COURSE_PROMPT: "${COURSE_PROMPT:-en-v2}"
    volumes:
      - api_state:/state
      - model_cache:/models
    mem_limit: 16g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 600s
  mlflow:
    build:
      context: ..
      dockerfile: coursework/Dockerfile.tracking
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - tracking_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
  cli:
    profiles: ["cli"]
    build:
      context: ..
      dockerfile: coursework/Dockerfile.cli
    environment:
      COURSE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_state:
  model_cache:
  tracking_state:
